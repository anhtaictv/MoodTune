name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_model:
        description: "Ghi đè weights/dynamic_* đang chạy bằng bản trong git (chỉ dùng sau khi retrain offline)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate JSON
        working-directory: .
        run: |
          for f in frontend/manifest.json backend/weights_meta.json backend/dynamic_lexicon.json backend/dynamic_vocab.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, moodtune-vps]
    environment: production
    concurrency:
      group: deploy-moodtune
      cancel-in-progress: false
    env:
      # Runner chạy LocalSystem, còn PM2 daemon (moodtune-backend) thuộc user Administrator.
      PM2_HOME: C:\Users\Administrator\.pm2
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to C:\moodtune
        shell: powershell
        run: |
          # pm2 global chỉ nằm trong AppData\Roaming\npm của Administrator, không có trong PATH của LocalSystem.
          $env:Path = "C:\Users\Administrator\AppData\Roaming\npm;$env:Path"
          $deployArgs = @{ Source = $env:GITHUB_WORKSPACE }
          if ("${{ inputs.deploy_model }}" -eq "true") { $deployArgs.DeployModel = $true }
          & .\deploy\deploy.ps1 @deployArgs
